{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="page-hdr"><h1>Change Password</h1><p>Update your account password</p></div>
<div style="max-width:500px;">
<div class="u-card">
  <div class="u-card-head"><h5>🔒 Set New Password</h5></div>
  <div class="u-card-body">
    <form method="post" novalidate>{% csrf_token %}
      <div class="u-fg">
        <label class="u-label">Current Password</label>
        <input type="password" name="old_password" class="u-input" placeholder="••••••••">
      </div>
      <div class="u-fg">
        <label class="u-label">New Password</label>
        <input type="password" name="new_password1" class="u-input" placeholder="Min. 8 characters">
      </div>
      <div class="u-fg">
        <label class="u-label">Confirm New Password</label>
        <input type="password" name="new_password2" class="u-input" placeholder="Repeat new password">
      </div>
      <div style="display:flex;gap:10px;">
        <button type="submit" class="ubtn ubtn-primary">Update Password</button>
        <a href="{% url 'accounts:profile' %}" class="ubtn ubtn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
</div>
{% endblock %}
